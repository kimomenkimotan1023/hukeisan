<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>麻雀点数計算トレーナー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Noto+Sans+JP:wght@500;700;800;900&family=Noto+Serif+JP:wght@700;900&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    /* Enforce single-line text everywhere */
    .nowrap-strict {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Strictly 1-Row Hand Container: Never wraps even on 320px screens */
    .hand-single-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      gap: 2px;
      padding-top: 14px;
    }
    /* Each upright tile (100x138) scales fluidly within the single row */
    .tile-fluid-item {
      position: relative;
      flex: 100 1 0%;
      aspect-ratio: 100 / 138;
      min-width: 0;
      max-width: 40px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    /* Each sideways called tile (132x106) matches upright tile scale 1:1 (96x128 face rotated to 128x96) */
    .tile-fluid-sideways {
      position: relative;
      flex: 132 1 0%;
      aspect-ratio: 132 / 106;
      min-width: 0;
      max-width: 52.8px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .tile-fluid-item svg,
    .tile-fluid-sideways svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .win-tile-badge {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 900;
      padding: 1px 4px;
      border-radius: 4px;
      background-color: #fef3c7;
      border: 1px solid #f59e0b;
      color: #b45309;
      line-height: 1.1;
      white-space: nowrap;
      pointer-events: none;
    }
    /* Small gap before open melds or winning tile */
    .tile-group-gap {
      margin-left: 5px;
    }
    @media (min-width: 640px) {
      .tile-group-gap {
        margin-left: 10px;
      }
    }
    .score-input-box {
      transition: all 0.12s ease;
      white-space: nowrap;
    }
    .score-input-active {
      border-color: #059669 !important;
      background-color: #ecfdf5 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }
    .tenkey-btn {
      user-select: none;
      -webkit-user-select: none;
      white-space: nowrap;
      transition: transform 0.05s ease, background-color 0.1s ease;
    }
    .tenkey-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <!-- 1-Line Clean Header -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 px-3 py-2 shadow-sm">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2 whitespace-nowrap">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="w-6 h-6 rounded-md bg-emerald-600 text-white font-serif font-black text-xs flex items-center justify-center shrink-0">点</span>
        <h1 class="app-title text-sm sm:text-base font-black text-slate-900 truncate">麻雀点数計算トレーナー</h1>
        <span id="mode-indicator-pill" class="hidden px-1.5 py-0.5 rounded bg-rose-600 text-white font-black text-[10px] shrink-0">復習中</span>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-toggle-review" type="button" class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-700 font-black text-[11px] sm:text-xs border border-rose-200 whitespace-nowrap transition">
          復習 (0問)
        </button>
        <button id="btn-generate-next" type="button" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold text-[11px] sm:text-xs border border-slate-300 whitespace-nowrap transition">
          次へ ↻
        </button>
      </div>
    </div>
  </header>

  <!-- 1-Line Centered Stats Bar -->
  <div class="bg-slate-100 border-b border-slate-200 px-3 py-1.5">
    <div class="max-w-xl mx-auto flex items-center justify-center gap-3 sm:gap-5 text-[11px] sm:text-xs font-bold text-slate-700 whitespace-nowrap">
      <span>解答数: <strong id="stat-total" class="text-slate-900 font-black">0問</strong></span>
      <span class="text-slate-300">｜</span>
      <span>正解数: <strong id="stat-accuracy" class="text-emerald-700 font-black">0問 (0%)</strong></span>
      <span class="text-slate-300">｜</span>
      <span>連続正解: <strong id="stat-streak" class="text-amber-600 font-black">0問</strong></span>
    </div>
  </div>

  <!-- Main Single-Column Container -->
  <main class="flex-1 max-w-xl w-full mx-auto px-2 sm:px-4 pt-2 pb-6 space-y-2.5">

    <!-- ===============================================================
         1. SITUATION BAR & SINGLE-ROW HAND RACK
         =============================================================== -->
    <section class="bg-white border border-slate-200 rounded-2xl p-2 sm:p-3.5 shadow-sm space-y-2">

      <!-- Row 1: Situation Bar (Wind / Riichi / Ippatsu) -->
      <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 whitespace-nowrap overflow-hidden">
        <span id="hud-wind-badge" class="px-2 py-0.5 rounded-md bg-emerald-600 text-white font-black text-xs shrink-0">
          東場 東家(親)
        </span>
        <span id="hud-riichi-badge" class="hidden px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 border border-amber-300 font-black text-xs shrink-0">
          リーチ
        </span>
        <span id="hud-ippatsu-badge" class="hidden px-2 py-0.5 rounded-md bg-purple-600 text-white font-black text-xs shrink-0">
          一発
        </span>
      </div>

      <!-- Row 2: Dora & Ura-Dora Indicator Bar (Placed 1 row below) -->
      <div class="flex items-center gap-4 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 whitespace-nowrap overflow-hidden">
        <div class="flex items-center gap-1.5 shrink-0">
          <span class="text-xs font-bold text-slate-600">ドラ表示牌</span>
          <div id="hud-dora-tile" class="w-6 sm:w-7 flex items-center"></div>
        </div>
        <div id="hud-uradora-wrap" class="hidden flex items-center gap-1.5 pl-3 border-l border-slate-200 shrink-0">
          <span class="text-xs font-bold text-amber-700">裏ドラ表示牌</span>
          <div id="hud-uradora-tile" class="w-6 sm:w-7 flex items-center"></div>
        </div>
      </div>

      <!-- Strictly 1-Row Hand Rack (14~16 tiles fluidly scaled, with sideways open melds) -->
      <div class="bg-emerald-50/50 border border-emerald-200/80 rounded-xl px-1.5 py-2.5 sm:px-3 sm:py-3">
        <div id="hand-tiles-container" class="hand-single-row">
          <!-- Populated dynamically by JS -->
        </div>
      </div>
    </section>

    <!-- ===============================================================
         2. SCORE INPUT & 3-COLUMN TENKEY
         =============================================================== -->
    <section id="answer-section" class="bg-white border border-slate-200 rounded-2xl p-2.5 sm:p-4 shadow-sm space-y-2.5">

      <!-- Dynamic Score Input Box (Strictly 1-Line Labels) -->
      <!-- Case A: Single Input (ロン / 親ツモオール) -->
      <div id="single-input-wrap" class="flex items-center justify-center">
        <button id="box-single" type="button" class="score-input-box score-input-active w-full h-12 sm:h-14 px-4 rounded-xl border-2 border-slate-300 bg-slate-50 flex items-center justify-between">
          <span id="label-single-left" class="text-xs sm:text-sm font-black text-slate-600">子のロン和了</span>
          <div class="flex items-baseline gap-1.5">
            <span id="val-single" class="font-mono font-black text-2xl sm:text-3xl text-slate-900">0</span>
            <span id="unit-single" class="text-sm sm:text-base font-black text-slate-700">点</span>
          </div>
        </button>
      </div>

      <!-- Case B: Dual Input for 子ツモ (子 [ 1000 ] 点 / 親 [ 2000 ] 点) -->
      <div id="dual-input-wrap" class="hidden grid grid-cols-2 gap-2">
        <button id="box-ko" type="button" class="score-input-box score-input-active h-12 sm:h-14 px-3 rounded-xl border-2 border-slate-300 bg-slate-50 flex items-center justify-between">
          <span class="px-2 py-0.5 rounded bg-slate-200 text-slate-800 text-xs font-black">子</span>
          <div class="flex items-baseline gap-1">
            <span id="val-ko" class="font-mono font-black text-xl sm:text-2xl text-slate-900">0</span>
            <span class="text-xs sm:text-sm font-black text-slate-600">点</span>
          </div>
        </button>
        <button id="box-oya" type="button" class="score-input-box h-12 sm:h-14 px-3 rounded-xl border-2 border-slate-300 bg-slate-50 flex items-center justify-between">
          <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 text-xs font-black">親</span>
          <div class="flex items-baseline gap-1">
            <span id="val-oya" class="font-mono font-black text-xl sm:text-2xl text-slate-900">0</span>
            <span class="text-xs sm:text-sm font-black text-slate-600">点</span>
          </div>
        </button>
      </div>

      <!-- Single-Line Validation Message -->
      <div id="input-error-msg" class="hidden text-center text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded-lg py-1 whitespace-nowrap">
        点数を入力してください
      </div>

      <!-- Clean 3-Column Tenkey + 1-Line Action Button -->
      <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
        <button type="button" data-key="7" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">7</button>
        <button type="button" data-key="8" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">8</button>
        <button type="button" data-key="9" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">9</button>

        <button type="button" data-key="4" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">4</button>
        <button type="button" data-key="5" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">5</button>
        <button type="button" data-key="6" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">6</button>

        <button type="button" data-key="1" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">1</button>
        <button type="button" data-key="2" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">2</button>
        <button type="button" data-key="3" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">3</button>

        <button type="button" data-key="0" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 font-mono font-black text-xl text-slate-900">0</button>
        <button type="button" data-key="00" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-300 font-mono font-black text-xl text-amber-900">00</button>
        <button type="button" data-key="CLR" class="tenkey-btn h-11 sm:h-12 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 font-black text-sm sm:text-base text-rose-700">クリア</button>
      </div>

      <!-- Full-Width Single-Line Submit / Next Field Button -->
      <button id="btn-submit-score" type="button" class="tenkey-btn w-full h-12 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base shadow-sm flex items-center justify-center">
        <span id="submit-btn-label">回答する</span>
      </button>

      <!-- Single-Line Rule Note -->
      <p class="text-center text-[11px] font-bold text-slate-500 whitespace-nowrap pt-0.5">
        ※3飜60符・4飜30符は切り上げ満貫 ／ 連風牌の雀頭は2符
      </p>
    </section>

    <!-- ===============================================================
         3. SINGLE-COLUMN RESULT & 1-LINE-PER-ITEM EXPLANATION
         =============================================================== -->
    <section id="result-section" class="hidden space-y-2.5">
      <!-- Verdict & Correct Score (Single-Column Clean Card) -->
      <div id="verdict-banner" class="rounded-2xl p-3.5 border-2 bg-white shadow-sm space-y-2.5">
        <div class="flex items-center justify-between gap-2 whitespace-nowrap">
          <div class="flex items-center gap-2 min-w-0">
            <span id="verdict-badge" class="px-2.5 py-0.5 rounded-md text-xs font-black shrink-0">正解</span>
            <span id="verdict-summary" class="text-sm sm:text-base font-black text-slate-900 truncate"></span>
          </div>
          <span id="verdict-user-ans" class="text-xs font-bold text-slate-500 shrink-0"></span>
        </div>

        <!-- 1-Line Review List Status & Toggle -->
        <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-200/70 whitespace-nowrap">
          <span id="review-status-msg" class="text-[11px] font-bold text-slate-600 truncate"></span>
          <button id="btn-toggle-bookmark" type="button" class="px-2.5 py-1 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-[11px] font-black shrink-0 transition">
            復習リストに残す
          </button>
        </div>

        <button id="btn-next-after-result" type="button" class="tenkey-btn w-full h-11 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm shadow-sm flex items-center justify-center">
          次の問題へ ▶
        </button>
      </div>

      <!-- Yaku Breakdown: 1 Row per Item (Left Name / Right Han) -->
      <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-sm space-y-1.5">
        <div class="flex items-center justify-between border-b border-slate-200 pb-1.5 text-xs font-black text-slate-800 whitespace-nowrap">
          <span>役・ドラ内訳</span>
          <span id="explain-han-total" class="font-mono text-indigo-700">合計 3飜</span>
        </div>
        <div id="explain-yaku-list" class="divide-y divide-slate-100 text-xs"></div>
      </div>

      <!-- Fu Breakdown: 1 Row per Item (Left Item / Right Fu) -->
      <div class="bg-white border border-slate-200 rounded-2xl p-3.5 shadow-sm space-y-1.5">
        <div class="flex items-center justify-between border-b border-slate-200 pb-1.5 text-xs font-black text-slate-800 whitespace-nowrap">
          <span>符の内訳</span>
          <span id="explain-fu-total" class="font-mono text-emerald-700">36符 → 切上 40符</span>
        </div>
        <div id="explain-fu-list" class="divide-y divide-slate-100 text-xs"></div>
      </div>
    </section>

  </main>

  <script>
    /*************************************************************************
     * 1. HIGH-VISIBILITY MAHJONG TILE SVG RENDERER (OPTIMIZED FOR 1-ROW MOBILE)
     *************************************************************************/
    const TILE_NAMES_JA = [
      '一萬','二萬','三萬','四萬','五萬','六萬','七萬','八萬','九萬',
      '一筒','二筒','三筒','四筒','五筒','六筒','七筒','八筒','九筒',
      '一索','二索','三索','四索','五索','六索','七索','八索','九索',
      '東','南','西','北','白','發','中'
    ];
    const KANJI_NUMS = ['一','二','三','四','五','六','七','八','九'];
    const JIHAI_CHARS = ['東','南','西','北','白','發','中'];

    const isYaochu = (idx) => {
      if (idx >= 27) return true;
      const n = idx % 9;
      return n === 0 || n === 8;
    };

    function drawCleanPin(cx, cy, r, fillHex) {
      const ringR = (r * 0.56).toFixed(1);
      const centerR = (r * 0.22).toFixed(1);
      const strokeW = Math.max(2.0, r * 0.15).toFixed(1);
      return `
        <g>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fillHex}" />
          <circle cx="${cx}" cy="${cy}" r="${ringR}" fill="none" stroke="#ffffff" stroke-width="${strokeW}" />
          <circle cx="${cx}" cy="${cy}" r="${centerR}" fill="#ffffff" />
        </g>
      `;
    }

    function drawCleanBamboo(x1, y1, x2, y2, fillHex, width = 15) {
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      const len = Math.hypot(x2 - x1, y2 - y1);
      const angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI) - 90;
      const r = width / 2;
      return `
        <g transform="translate(${mx.toFixed(1)}, ${my.toFixed(1)}) rotate(${angle.toFixed(1)})">
          <rect x="${(-r).toFixed(1)}" y="${(-len / 2).toFixed(1)}" width="${width.toFixed(1)}" height="${len.toFixed(1)}" rx="${r.toFixed(1)}" fill="${fillHex}" />
          <rect x="${(-r - 1).toFixed(1)}" y="-2.8" width="${(width + 2).toFixed(1)}" height="5.6" rx="2" fill="#ffffff" />
          <line x1="${(-r).toFixed(1)}" y1="0" x2="${r.toFixed(1)}" y2="0" stroke="${fillHex}" stroke-width="1.5" />
        </g>
      `;
    }

    /**
     * Renders a crisp, fluid SVG tile with exact 100x138 dimensions.
     */
    function renderTileSVG(tileIdx, { isBack = false, highlight = false } = {}) {
      if (isBack) {
        return `
          <svg viewBox="0 0 100 138" class="w-full h-full select-none">
            <rect x="2" y="6" width="96" height="130" rx="11" fill="#94a3b8" />
            <rect x="2" y="2" width="96" height="130" rx="11" fill="#0284c7" stroke="#0369a1" stroke-width="3" />
            <rect x="11" y="11" width="78" height="112" rx="7" fill="#0ea5e9" />
          </svg>
        `;
      }

      const NAVY  = '#1e3a8a';
      const RED   = '#dc2626';
      const GREEN = '#15803d';
      const INK   = '#0f172a';
      const SERIF = `'Shippori Mincho B1', 'Noto Serif JP', serif`;

      let content = '';

      // 1. MANZU (0..8) - Extra-large bold characters for 1-row mobile legibility
      if (tileIdx >= 0 && tileIdx <= 8) {
        const kanji = KANJI_NUMS[tileIdx];
        content = `
          <text x="50" y="60" text-anchor="middle" font-family="${SERIF}" font-weight="900" font-size="62" fill="${INK}">${kanji}</text>
          <text x="50" y="121" text-anchor="middle" font-family="${SERIF}" font-weight="900" font-size="56" fill="${RED}">萬</text>
        `;
      }

      // 2. PINZU (9..17) - Unified colors (2p,4p,8p Navy; 5p Navy+Red; 6p 2Navy+4Red; 7p 3Green+4Red; 9p 3-color)
      else if (tileIdx >= 9 && tileIdx <= 17) {
        const n = tileIdx - 8;
        if (n === 1) {
          content = `
            <circle cx="50" cy="70" r="41" fill="${NAVY}" />
            <circle cx="50" cy="70" r="32" fill="none" stroke="#ffffff" stroke-width="4" />
            <circle cx="50" cy="70" r="24" fill="${RED}" />
            <circle cx="50" cy="70" r="13" fill="none" stroke="#ffffff" stroke-width="3.2" />
            <circle cx="50" cy="70" r="5.5" fill="#ffffff" />
          `;
        } else if (n === 2) {
          content = drawCleanPin(50, 36, 26, NAVY) + drawCleanPin(50, 104, 26, NAVY);
        } else if (n === 3) {
          content = drawCleanPin(23, 27, 21, GREEN) + drawCleanPin(50, 70, 21, RED) + drawCleanPin(77, 113, 21, NAVY);
        } else if (n === 4) {
          content =
            drawCleanPin(27, 36, 22, NAVY) + drawCleanPin(73, 36, 22, NAVY) +
            drawCleanPin(27, 104, 22, NAVY) + drawCleanPin(73, 104, 22, NAVY);
        } else if (n === 5) {
          content =
            drawCleanPin(25, 30, 19.5, NAVY) + drawCleanPin(75, 30, 19.5, NAVY) +
            drawCleanPin(50, 70, 20, RED) +
            drawCleanPin(25, 110, 19.5, NAVY) + drawCleanPin(75, 110, 19.5, NAVY);
        } else if (n === 6) {
          content =
            drawCleanPin(27, 27, 18.5, NAVY) + drawCleanPin(73, 27, 18.5, NAVY) +
            drawCleanPin(27, 77, 18.5, RED)  + drawCleanPin(73, 77, 18.5, RED) +
            drawCleanPin(27, 114, 18.5, RED) + drawCleanPin(73, 114, 18.5, RED);
        } else if (n === 7) {
          content =
            drawCleanPin(22, 22, 16, GREEN) + drawCleanPin(50, 35, 16, GREEN) + drawCleanPin(78, 48, 16, GREEN) +
            drawCleanPin(27, 83, 17.5, RED) + drawCleanPin(73, 83, 17.5, RED) +
            drawCleanPin(27, 116, 17.5, RED) + drawCleanPin(73, 116, 17.5, RED);
        } else if (n === 8) {
          for (let r = 0; r < 4; r++) {
            const y = 23 + r * 31;
            content += drawCleanPin(27, y, 15, NAVY) + drawCleanPin(73, y, 15, NAVY);
          }
        } else if (n === 9) {
          const rowColors = [NAVY, RED, GREEN];
          const ys = [26, 70, 114];
          const xs = [21, 50, 79];
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
              content += drawCleanPin(xs[c], ys[r], 15, rowColors[r]);
            }
          }
        }
      }

      // 3. SOUZU (18..26) - Authentic 8s M/W shape & bold bamboo sticks
      else if (tileIdx >= 18 && tileIdx <= 26) {
        const n = tileIdx - 17;
        if (n === 1) {
          content = `
            <circle cx="50" cy="55" r="34" fill="#dcfce7" stroke="${GREEN}" stroke-width="3.5" />
            <path d="M22 96 C20 64, 35 44, 50 44 C65 44, 80 64, 78 96 C68 114, 32 114, 22 96 Z" fill="${GREEN}" />
            <circle cx="50" cy="35" r="11" fill="${GREEN}" stroke="#ffffff" stroke-width="2" />
            <path d="M44 20 L50 10 L56 20 Z" fill="${RED}" />
            <circle cx="50" cy="77" r="16" fill="${RED}" stroke="#ffffff" stroke-width="2.5" />
            <circle cx="50" cy="77" r="6.5" fill="#fef08a" />
            <line x1="20" y1="120" x2="80" y2="120" stroke="${RED}" stroke-width="6" stroke-linecap="round" />
          `;
        } else if (n === 2) {
          content = drawCleanBamboo(50, 12, 50, 63, GREEN, 18) + drawCleanBamboo(50, 77, 50, 128, GREEN, 18);
        } else if (n === 3) {
          content =
            drawCleanBamboo(50, 12, 50, 63, GREEN, 17.5) +
            drawCleanBamboo(27, 77, 27, 128, GREEN, 17.5) +
            drawCleanBamboo(73, 77, 73, 128, GREEN, 17.5);
        } else if (n === 4) {
          content =
            drawCleanBamboo(27, 12, 27, 63, GREEN, 17.5) + drawCleanBamboo(73, 12, 73, 63, GREEN, 17.5) +
            drawCleanBamboo(27, 77, 27, 128, GREEN, 17.5) + drawCleanBamboo(73, 77, 73, 128, GREEN, 17.5);
        } else if (n === 5) {
          content =
            drawCleanBamboo(21, 12, 21, 63, GREEN, 15.5) + drawCleanBamboo(79, 12, 79, 63, GREEN, 15.5) +
            drawCleanBamboo(21, 77, 21, 128, GREEN, 15.5) + drawCleanBamboo(79, 77, 79, 128, GREEN, 15.5) +
            drawCleanBamboo(50, 44, 50, 96, RED, 16);
        } else if (n === 6) {
          content =
            drawCleanBamboo(21, 12, 21, 63, GREEN, 15.5) + drawCleanBamboo(50, 12, 50, 63, GREEN, 15.5) + drawCleanBamboo(79, 12, 79, 63, GREEN, 15.5) +
            drawCleanBamboo(21, 77, 21, 128, GREEN, 15.5) + drawCleanBamboo(50, 77, 50, 128, GREEN, 15.5) + drawCleanBamboo(79, 77, 79, 128, GREEN, 15.5);
        } else if (n === 7) {
          content =
            drawCleanBamboo(50, 10, 50, 45, RED, 15) +
            drawCleanBamboo(21, 51, 21, 86, GREEN, 15) + drawCleanBamboo(50, 51, 50, 86, GREEN, 15) + drawCleanBamboo(79, 51, 79, 86, GREEN, 15) +
            drawCleanBamboo(21, 92, 21, 128, GREEN, 15) + drawCleanBamboo(50, 92, 50, 128, GREEN, 15) + drawCleanBamboo(79, 92, 79, 128, GREEN, 15);
        } else if (n === 8) {
          content =
            drawCleanBamboo(18, 12, 18, 63, GREEN, 14) +
            drawCleanBamboo(22, 14, 47, 60, GREEN, 13.5) +
            drawCleanBamboo(78, 14, 53, 60, GREEN, 13.5) +
            drawCleanBamboo(82, 12, 82, 63, GREEN, 14) +
            drawCleanBamboo(18, 77, 18, 128, GREEN, 14) +
            drawCleanBamboo(22, 126, 47, 80, GREEN, 13.5) +
            drawCleanBamboo(78, 126, 53, 80, GREEN, 13.5) +
            drawCleanBamboo(82, 77, 82, 128, GREEN, 14);
        } else if (n === 9) {
          const xs = [21, 50, 79];
          const cols = [GREEN, RED, GREEN];
          const ys = [[10, 45], [51, 86], [92, 128]];
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
              content += drawCleanBamboo(xs[c], ys[r][0], xs[c], ys[r][1], cols[c], 15);
            }
          }
        }
      }

      // 4. JIHAI (27..33)
      else if (tileIdx >= 27 && tileIdx <= 33) {
        const z = tileIdx - 27;
        if (z === 4) {
          content = `
            <rect x="15" y="18" width="70" height="100" rx="10" fill="#ffffff" stroke="#334155" stroke-width="4.5" />
            <rect x="23" y="26" width="54" height="84" rx="6" fill="none" stroke="#94a3b8" stroke-width="2.5" />
          `;
        } else {
          const ch = JIHAI_CHARS[z];
          const col = z === 5 ? GREEN : z === 6 ? RED : INK;
          content = `
            <text x="50" y="98" text-anchor="middle" font-family="${SERIF}" font-weight="900" font-size="76" fill="${col}">${ch}</text>
          `;
        }
      }

      const borderStroke = highlight ? '#d97706' : '#64748b';
      const borderWidth = highlight ? '4.5' : '3';
      const faceBg = highlight ? '#fffbeb' : '#ffffff';

      return `
        <svg viewBox="0 0 100 138" class="w-full h-full select-none">
          <rect x="2" y="6" width="96" height="130" rx="11" fill="#cbd5e1" />
          <rect x="2" y="3.5" width="96" height="130" rx="11" fill="#f59e0b" />
          <rect x="2" y="2" width="96" height="128" rx="11" fill="${faceBg}" stroke="${borderStroke}" stroke-width="${borderWidth}" />
          ${content}
        </svg>
      `;
    }

    /**
     * Renders a dedicated sideways tile SVG (viewBox="0 0 132 106") for open melds (Pon / Chi / Minkan).
     * Uses the exact 128x96 rotated face of the upright 96x128 tile and rotates the inner artwork
     * around the exact face coordinates via `<g transform="translate(0, 100) rotate(-90)">`.
     */
    function renderSidewaysTileSVG(tileIdx) {
      // Extract only the inner face artwork (excluding the upright 3D outer rect layers)
      const fullSvg = renderTileSVG(tileIdx);
      const innerArtwork = fullSvg
        .replace(/<svg[^>]*>/, '')
        .replace(/<\/svg>/, '')
        .replace(/<rect x="2" y="6"[^>]*\/>/, '')
        .replace(/<rect x="2" y="3\.5"[^>]*\/>/, '')
        .replace(/<rect x="2" y="2"[^>]*\/>/, '');

      return `
        <svg viewBox="0 0 132 106" class="w-full h-full select-none">
          <rect x="2" y="6" width="128" height="98" rx="11" fill="#cbd5e1" />
          <rect x="2" y="3.5" width="128" height="98" rx="11" fill="#f59e0b" />
          <rect x="2" y="2" width="128" height="96" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="3" />
          <g transform="translate(0, 100) rotate(-90)">
            ${innerArtwork}
          </g>
        </svg>
      `;
    }

    /*************************************************************************
     * 2. RIGOROUS PROCEDURAL HAND, FU, YAKU & SCORE ENGINE (100% VALIDATED)
     *************************************************************************/
    const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function getActualDoraIdx(indicatorIdx) {
      if (indicatorIdx < 27) {
        const suitBase = Math.floor(indicatorIdx / 9) * 9;
        const pos = indicatorIdx % 9;
        return suitBase + ((pos + 1) % 9);
      }
      if (indicatorIdx <= 30) {
        return 27 + ((indicatorIdx - 27 + 1) % 4);
      }
      return 31 + ((indicatorIdx - 31 + 1) % 3);
    }

    function computeMahjongPoints(fu, han, isDealer, isTsumo) {
      let basePoints = fu * Math.pow(2, han + 2);
      let limitName = '';
      const isKiriageMangan = (han === 3 && fu === 60) || (han === 4 && fu === 30);

      if (han >= 13) { basePoints = 8000; limitName = '役満'; }
      else if (han >= 11) { basePoints = 6000; limitName = '三倍満'; }
      else if (han >= 8) { basePoints = 4000; limitName = '倍満'; }
      else if (han >= 6) { basePoints = 3000; limitName = '跳満'; }
      else if (han >= 5 || basePoints >= 2000) { basePoints = 2000; limitName = '満貫'; }
      else if (isKiriageMangan) { basePoints = 2000; limitName = '満貫(切上)'; }

      const ceil100 = (n) => Math.ceil(n / 100) * 100;
      let scoreLabel = '';
      let expectedSingle = 0;
      let expectedKo = 0;
      let expectedOya = 0;

      if (isDealer) {
        if (isTsumo) {
          const koPay = ceil100(basePoints * 2);
          expectedSingle = koPay;
          scoreLabel = `${koPay.toLocaleString()}点オール`;
        } else {
          const ronPay = ceil100(basePoints * 6);
          expectedSingle = ronPay;
          scoreLabel = `${ronPay.toLocaleString()}点`;
        }
      } else {
        if (isTsumo) {
          const koPay = ceil100(basePoints * 1);
          const oyaPay = ceil100(basePoints * 2);
          expectedKo = koPay;
          expectedOya = oyaPay;
          scoreLabel = `${koPay.toLocaleString()} / ${oyaPay.toLocaleString()}点`;
        } else {
          const ronPay = ceil100(basePoints * 4);
          expectedSingle = ronPay;
          scoreLabel = `${ronPay.toLocaleString()}点`;
        }
      }

      return {
        basePoints,
        limitName,
        isKiriageMangan,
        scoreLabel,
        expectedSingle,
        expectedKo,
        expectedOya
      };
    }

    function evaluateHandHighestScore({
      closedTilesWithWin,
      fixedMelds,
      winTileIdx,
      roundWindIdx,
      seatWindIdx,
      isMenzen,
      isTsumo,
      hasRiichi,
      hasIppatsu = false,
      doraIndicatorIdx,
      uraDoraIndicatorIdx = null
    }) {
      const actualDoraIdx = getActualDoraIdx(doraIndicatorIdx);
      const actualUraDoraIdx = (hasRiichi && uraDoraIndicatorIdx !== null)
        ? getActualDoraIdx(uraDoraIndicatorIdx)
        : -1;

      const allTilesInHand = [...closedTilesWithWin];
      fixedMelds.forEach(m => allTilesInHand.push(...m.tiles));

      const doraCount = allTilesInHand.filter(t => t === actualDoraIdx).length;
      const uraDoraCount = actualUraDoraIdx >= 0
        ? allTilesInHand.filter(t => t === actualUraDoraIdx).length
        : 0;

      const closedCounts = new Array(34).fill(0);
      closedTilesWithWin.forEach(t => { closedCounts[t]++; });

      const candidates = [];

      // 1. Chiitoitsu (25 Fu fixed)
      if (fixedMelds.length === 0 && closedTilesWithWin.length === 14) {
        const pairs = [];
        for (let i = 0; i < 34; i++) {
          if (closedCounts[i] === 2) pairs.push(i);
        }
        if (pairs.length === 7) {
          const yakuList = [];
          if (hasRiichi) yakuList.push({ name: 'リーチ', han: 1 });
          if (hasRiichi && hasIppatsu) yakuList.push({ name: '一発', han: 1 });
          if (isTsumo) yakuList.push({ name: '門前清自摸和', han: 1 });
          yakuList.push({ name: '七対子', han: 2 });

          if (allTilesInHand.every(t => !isYaochu(t))) {
            yakuList.push({ name: '断幺九', han: 1 });
          }
          if (allTilesInHand.every(t => isYaochu(t))) {
            yakuList.push({ name: '混老頭', han: 2 });
          }
          const suitSet = new Set();
          let hasHonors = false;
          allTilesInHand.forEach(t => {
            if (t >= 27) hasHonors = true;
            else suitSet.add(Math.floor(t / 9));
          });
          if (suitSet.size === 1) {
            if (hasHonors) yakuList.push({ name: '混一色', han: 3 });
            else yakuList.push({ name: '清一色', han: 6 });
          }

          if (doraCount > 0) {
            yakuList.push({ name: `ドラ (${TILE_NAMES_JA[actualDoraIdx]}×${doraCount})`, han: doraCount });
          }
          if (uraDoraCount > 0) {
            yakuList.push({ name: `裏ドラ (${TILE_NAMES_JA[actualUraDoraIdx]}×${uraDoraCount})`, han: uraDoraCount });
          }

          const totalHan = yakuList.reduce((s, y) => s + y.han, 0);
          const isDealer = seatWindIdx === 27;
          const scoreInfo = computeMahjongPoints(25, totalHan, isDealer, isTsumo);

          candidates.push({
            isChiitoitsu: true,
            rawFu: 25,
            finalFu: 25,
            fuLineItems: [
              { label: '七対子 (固定符)', fuText: '25符' }
            ],
            yakuList,
            totalHan,
            scoreInfo
          });
        }
      }

      // 2. Standard 4 Mentsu + 1 Jantou
      const neededClosedMentsu = 4 - fixedMelds.length;
      const partitions = [];

      function extractMentsu(counts, startIdx, currentMentsu) {
        let first = -1;
        for (let i = startIdx; i < 34; i++) {
          if (counts[i] > 0) { first = i; break; }
        }
        if (first === -1) {
          if (currentMentsu.length === neededClosedMentsu) {
            partitions.push(currentMentsu.map(m => ({ ...m, tiles: [...m.tiles] })));
          }
          return;
        }
        if (counts[first] >= 3) {
          counts[first] -= 3;
          currentMentsu.push({ kind: 'koutsu', tiles: [first, first, first], isOpen: false });
          extractMentsu(counts, first, currentMentsu);
          currentMentsu.pop();
          counts[first] += 3;
        }
        if (first < 27 && (first % 9) <= 6 && counts[first + 1] > 0 && counts[first + 2] > 0) {
          counts[first]--;
          counts[first + 1]--;
          counts[first + 2]--;
          currentMentsu.push({ kind: 'shuntsu', tiles: [first, first + 1, first + 2], isOpen: false });
          extractMentsu(counts, first, currentMentsu);
          currentMentsu.pop();
          counts[first]++;
          counts[first + 1]++;
          counts[first + 2]++;
        }
      }

      for (let jIdx = 0; jIdx < 34; jIdx++) {
        if (closedCounts[jIdx] >= 2) {
          closedCounts[jIdx] -= 2;
          partitions.length = 0;
          extractMentsu(closedCounts, 0, []);

          for (const closedMentsuList of partitions) {
            if (jIdx === winTileIdx) {
              const cand = scoreStandardInterpretation({
                closedMentsuList,
                fixedMelds,
                jIdx,
                winInJantou: true,
                winMentsuIndex: -1,
                waitType: 'tanki',
                winTileIdx,
                roundWindIdx,
                seatWindIdx,
                isMenzen,
                isTsumo,
                hasRiichi,
                hasIppatsu,
                allTilesInHand,
                actualDoraIdx,
                doraCount,
                actualUraDoraIdx,
                uraDoraCount
              });
              if (cand) candidates.push(cand);
            }

            for (let mIdx = 0; mIdx < closedMentsuList.length; mIdx++) {
              const m = closedMentsuList[mIdx];
              if (!m.tiles.includes(winTileIdx)) continue;

              let wType = 'ryanmen';
              if (m.kind === 'koutsu') {
                wType = 'shanpon';
              } else {
                const a = m.tiles[0];
                if (winTileIdx === a + 1) {
                  wType = 'kanchan';
                } else if ((winTileIdx === a + 2 && (a % 9) === 0) || (winTileIdx === a && (a % 9) === 6)) {
                  wType = 'penchan';
                } else {
                  wType = 'ryanmen';
                }
              }

              const cand = scoreStandardInterpretation({
                closedMentsuList,
                fixedMelds,
                jIdx,
                winInJantou: false,
                winMentsuIndex: mIdx,
                waitType: wType,
                winTileIdx,
                roundWindIdx,
                seatWindIdx,
                isMenzen,
                isTsumo,
                hasRiichi,
                hasIppatsu,
                allTilesInHand,
                actualDoraIdx,
                doraCount,
                actualUraDoraIdx,
                uraDoraCount
              });
              if (cand) candidates.push(cand);
            }
          }

          closedCounts[jIdx] += 2;
        }
      }

      if (candidates.length === 0) return null;

      candidates.sort((a, b) => {
        if (b.scoreInfo.basePoints !== a.scoreInfo.basePoints) return b.scoreInfo.basePoints - a.scoreInfo.basePoints;
        if (b.totalHan !== a.totalHan) return b.totalHan - a.totalHan;
        if (b.finalFu !== a.finalFu) return b.finalFu - a.finalFu;
        return b.rawFu - a.rawFu;
      });

      return candidates[0];
    }

    function scoreStandardInterpretation({
      closedMentsuList,
      fixedMelds,
      jIdx,
      winInJantou,
      winMentsuIndex,
      waitType,
      winTileIdx,
      roundWindIdx,
      seatWindIdx,
      isMenzen,
      isTsumo,
      hasRiichi,
      hasIppatsu,
      allTilesInHand,
      actualDoraIdx,
      doraCount,
      actualUraDoraIdx,
      uraDoraCount
    }) {
      const blocks = [
        ...closedMentsuList.map((m, idx) => ({
          kind: m.kind,
          tiles: [...m.tiles],
          isOpen: false,
          isWinBlock: !winInJantou && idx === winMentsuIndex,
          waitType: (!winInJantou && idx === winMentsuIndex) ? waitType : undefined
        })),
        ...fixedMelds.map(m => ({
          kind: m.kind,
          tiles: [...m.tiles],
          isOpen: m.isOpen,
          isWinBlock: false
        }))
      ];

      const allShuntsu = blocks.every(b => b.kind === 'shuntsu' && !b.isOpen);
      const isYakuhaiJantou = (jIdx >= 31) || (jIdx === roundWindIdx) || (jIdx === seatWindIdx);
      const isExactPinfu = isMenzen && allShuntsu && !isYakuhaiJantou && waitType === 'ryanmen';

      // ==================== 1-LINE FU BREAKDOWN ITEMS ====================
      let rawFu = 20;
      let finalFu = 30;
      const fuLineItems = [{ label: '副底 (基本符)', fuText: '20符' }];

      if (isExactPinfu && isTsumo) {
        fuLineItems.push({ label: '平和ツモ特例', fuText: '0符' });
      } else if (isMenzen && !isTsumo) {
        rawFu += 10;
        fuLineItems.push({ label: '門前ロン', fuText: '+10符' });
      } else if (isTsumo) {
        rawFu += 2;
        fuLineItems.push({ label: 'ツモ和了', fuText: '+2符' });
      }

      // Mentsu Fu (only list blocks with >0 Fu, or show clean summary)
      blocks.forEach(b => {
        const t0 = b.tiles[0];
        const yao = isYaochu(t0);
        const typeStr = yao ? '么九' : '中張';
        if (b.kind === 'koutsu') {
          const completedByRon = b.isWinBlock && !isTsumo;
          const isMinkou = b.isOpen || completedByRon;
          if (isMinkou) {
            const f = yao ? 4 : 2;
            rawFu += f;
            const suffix = completedByRon ? '明刻(ロン和了)' : '明刻';
            fuLineItems.push({ label: `${TILE_NAMES_JA[t0]} ${suffix}(${typeStr})`, fuText: `+${f}符` });
          } else {
            const f = yao ? 8 : 4;
            rawFu += f;
            fuLineItems.push({ label: `${TILE_NAMES_JA[t0]} 暗刻(${typeStr})`, fuText: `+${f}符` });
          }
        } else if (b.kind === 'kantsu') {
          if (b.isOpen) {
            const f = yao ? 16 : 8;
            rawFu += f;
            fuLineItems.push({ label: `${TILE_NAMES_JA[t0]} 明槓(${typeStr})`, fuText: `+${f}符` });
          } else {
            const f = yao ? 32 : 16;
            rawFu += f;
            fuLineItems.push({ label: `${TILE_NAMES_JA[t0]} 暗槓(${typeStr})`, fuText: `+${f}符` });
          }
        }
      });

      // Jantou Fu (連風牌の雀頭も2符)
      if (jIdx === roundWindIdx && jIdx === seatWindIdx) {
        rawFu += 2;
        fuLineItems.push({ label: `${TILE_NAMES_JA[jIdx]}(連風牌) 雀頭`, fuText: '+2符' });
      } else if (jIdx === roundWindIdx) {
        rawFu += 2;
        fuLineItems.push({ label: `${TILE_NAMES_JA[jIdx]}(場風) 雀頭`, fuText: '+2符' });
      } else if (jIdx === seatWindIdx) {
        rawFu += 2;
        fuLineItems.push({ label: `${TILE_NAMES_JA[jIdx]}(自風) 雀頭`, fuText: '+2符' });
      } else if (jIdx >= 31) {
        rawFu += 2;
        fuLineItems.push({ label: `${TILE_NAMES_JA[jIdx]}(三元牌) 雀頭`, fuText: '+2符' });
      } else {
        fuLineItems.push({ label: `${TILE_NAMES_JA[jIdx]} 雀頭`, fuText: '0符' });
      }

      // Wait Fu
      const waitLabels = {
        ryanmen: '両面待ち',
        shanpon: 'シャンポン待ち',
        kanchan: 'カンチャン待ち',
        penchan: 'ペンチャン待ち',
        tanki: '単騎待ち'
      };
      const wFu = (waitType === 'kanchan' || waitType === 'penchan' || waitType === 'tanki') ? 2 : 0;
      rawFu += wFu;
      fuLineItems.push({
        label: `${waitLabels[waitType]} (${TILE_NAMES_JA[winTileIdx]})`,
        fuText: wFu > 0 ? '+2符' : '0符'
      });

      if (isExactPinfu && isTsumo) {
        finalFu = 20;
      } else if (!isMenzen && rawFu === 20) {
        finalFu = 30;
        fuLineItems.push({ label: '喰い平和形 繰上', fuText: '30符' });
      } else {
        finalFu = Math.ceil(rawFu / 10) * 10;
        if (finalFu < 30) finalFu = 30;
      }

      // ==================== YAKU EVALUATION ====================
      const yakuList = [];
      if (hasRiichi && isMenzen) yakuList.push({ name: 'リーチ', han: 1 });
      if (hasRiichi && isMenzen && hasIppatsu) yakuList.push({ name: '一発', han: 1 });
      if (isMenzen && isTsumo) yakuList.push({ name: '門前清自摸和', han: 1 });
      if (isExactPinfu) yakuList.push({ name: '平和', han: 1 });

      if (allTilesInHand.every(t => !isYaochu(t))) {
        yakuList.push({ name: '断幺九', han: 1 });
      }

      blocks.forEach(b => {
        if (b.kind === 'koutsu' || b.kind === 'kantsu') {
          const t = b.tiles[0];
          if (t === roundWindIdx && t === seatWindIdx) {
            yakuList.push({ name: `連風牌 ダブ${TILE_NAMES_JA[t]}`, han: 2 });
          } else {
            if (t === roundWindIdx) yakuList.push({ name: `場風 ${TILE_NAMES_JA[t]}`, han: 1 });
            if (t === seatWindIdx) yakuList.push({ name: `自風 ${TILE_NAMES_JA[t]}`, han: 1 });
          }
          if (t === 31) yakuList.push({ name: '役牌 白', han: 1 });
          if (t === 32) yakuList.push({ name: '役牌 發', han: 1 });
          if (t === 33) yakuList.push({ name: '役牌 中', han: 1 });
        }
      });

      const allKoutsuOrKan = blocks.every(b => b.kind === 'koutsu' || b.kind === 'kantsu');
      if (allKoutsuOrKan) {
        yakuList.push({ name: '対々和', han: 2 });
      }

      const ankouCount = blocks.filter(b =>
        (b.kind === 'koutsu' || b.kind === 'kantsu') &&
        !b.isOpen &&
        !(b.isWinBlock && !isTsumo)
      ).length;
      if (ankouCount === 4) {
        return null; // Reject accidental Suuankou (Yakuman)
      }
      if (ankouCount === 3) {
        yakuList.push({ name: '三暗刻', han: 2 });
      }

      const kanCount = blocks.filter(b => b.kind === 'kantsu').length;
      if (kanCount === 4) {
        return null; // Reject accidental Suukantsu (Yakuman)
      }
      if (kanCount === 3) {
        yakuList.push({ name: '三槓子', han: 2 });
      }

      const dragonKoutsuCount = blocks.filter(b => (b.kind === 'koutsu' || b.kind === 'kantsu') && b.tiles[0] >= 31).length;
      if (dragonKoutsuCount === 3) {
        return null; // Reject accidental Daisangen (Yakuman)
      }
      if (dragonKoutsuCount === 2 && jIdx >= 31) {
        yakuList.push({ name: '小三元', han: 2 });
      }

      if (isMenzen) {
        const shuntsuKeys = blocks.filter(b => b.kind === 'shuntsu').map(b => b.tiles.join(','));
        const keyCounts = {};
        shuntsuKeys.forEach(k => { keyCounts[k] = (keyCounts[k] || 0) + 1; });
        const pairsOfSeq = Object.values(keyCounts).reduce((acc, c) => acc + Math.floor(c / 2), 0);
        if (pairsOfSeq === 2) yakuList.push({ name: '二盃口', han: 3 });
        else if (pairsOfSeq === 1) yakuList.push({ name: '一盃口', han: 1 });
      }

      const shuntsuStarts = blocks.filter(b => b.kind === 'shuntsu').map(b => b.tiles[0]);
      for (let pos = 0; pos <= 6; pos++) {
        if (shuntsuStarts.includes(pos) && shuntsuStarts.includes(9 + pos) && shuntsuStarts.includes(18 + pos)) {
          yakuList.push({ name: '三色同順', han: isMenzen ? 2 : 1 });
          break;
        }
      }

      const koutsuTiles = blocks.filter(b => b.kind === 'koutsu' || b.kind === 'kantsu').map(b => b.tiles[0]);
      for (let pos = 0; pos <= 8; pos++) {
        if (koutsuTiles.includes(pos) && koutsuTiles.includes(9 + pos) && koutsuTiles.includes(18 + pos)) {
          yakuList.push({ name: '三色同刻', han: 2 });
          break;
        }
      }

      for (const sBase of [0, 9, 18]) {
        if (shuntsuStarts.includes(sBase) && shuntsuStarts.includes(sBase + 3) && shuntsuStarts.includes(sBase + 6)) {
          yakuList.push({ name: '一気通貫', han: isMenzen ? 2 : 1 });
          break;
        }
      }

      const hasShuntsu = blocks.some(b => b.kind === 'shuntsu');
      const allBlocksHaveYaochu = blocks.every(b => b.tiles.some(t => isYaochu(t))) && isYaochu(jIdx);
      const hasHonorTile = allTilesInHand.some(t => t >= 27);
      const allHonors = allTilesInHand.every(t => t >= 27);
      if (allHonors) {
        return null; // Reject accidental Tsuuiisou (Yakuman)
      }
      if (allBlocksHaveYaochu) {
        if (!hasShuntsu) {
          if (!hasHonorTile) return null; // Reject accidental Chinroutou (Yakuman)
          yakuList.push({ name: '混老頭', han: 2 });
        } else if (!hasHonorTile) {
          yakuList.push({ name: '純全帯幺九', han: isMenzen ? 3 : 2 });
        } else {
          yakuList.push({ name: '混全帯幺九', han: isMenzen ? 2 : 1 });
        }
      }

      const suitSet = new Set();
      allTilesInHand.forEach(t => {
        if (t < 27) suitSet.add(Math.floor(t / 9));
      });
      if (suitSet.size === 1) {
        if (hasHonorTile) yakuList.push({ name: '混一色', han: isMenzen ? 3 : 2 });
        else yakuList.push({ name: '清一色', han: isMenzen ? 6 : 5 });
      }

      if (yakuList.length === 0) return null;

      if (doraCount > 0) {
        yakuList.push({ name: `ドラ (${TILE_NAMES_JA[actualDoraIdx]}×${doraCount})`, han: doraCount });
      }
      if (uraDoraCount > 0) {
        yakuList.push({ name: `裏ドラ (${TILE_NAMES_JA[actualUraDoraIdx]}×${uraDoraCount})`, han: uraDoraCount });
      }

      const totalHan = yakuList.reduce((s, y) => s + y.han, 0);
      const isDealer = seatWindIdx === 27;
      const scoreInfo = computeMahjongPoints(finalFu, totalHan, isDealer, isTsumo);

      return {
        isChiitoitsu: false,
        rawFu,
        finalFu,
        fuLineItems,
        yakuList,
        totalHan,
        scoreInfo
      };
    }

    function generateRigorousFuProblem() {
      const archetypes = [
        'pinfu', 'menzen_standard', 'open_yakuhai', 'tanyao_standard',
        'high_fu_kan', 'toitoi_sanankou', 'menzen_ankou_tanki',
        'shanpon_ron_trap', 'open_pinfu_30fu', 'double_wind_jantou', 'chiitoitsu_25fu'
      ];

      for (let attempt = 0; attempt < 300; attempt++) {
        const arch = pickRandom(archetypes);
        const prob = tryBuildValidatedHand(arch);
        if (!prob) continue;
        if (prob.totalHan >= 1 && prob.totalHan <= 4) {
          return prob;
        }
        if (prob.totalHan === 5 && Math.random() < 0.12) {
          return prob;
        }
      }
      for (let attempt = 0; attempt < 200; attempt++) {
        const prob = tryBuildValidatedHand('menzen_standard');
        if (prob) return prob;
      }
      return null;
    }

    function tryBuildValidatedHand(arch) {
      const usedCounts = new Array(34).fill(0);
      const canUse = (idx, n) => usedCounts[idx] + n <= 4;
      const take = (idx, n) => {
        if (!canUse(idx, n)) return false;
        usedCounts[idx] += n;
        return true;
      };

      let roundWindIdx = pickRandom([27, 28]);
      let seatWindIdx = pickRandom([27, 28, 29, 30]);
      let isMenzen = true;
      let isTsumo = Math.random() < 0.5;
      let hasRiichi = false;

      const closedTilesWithWin = [];
      const fixedMelds = [];
      let winTileIdx = 0;
      const suits = [0, 9, 18];

      if (arch === 'chiitoitsu_25fu') {
        isMenzen = true;
        isTsumo = Math.random() < 0.5;
        hasRiichi = Math.random() < 0.55;
        const pool = Array.from({ length: 34 }, (_, i) => i).sort(() => Math.random() - 0.5);
        const pairs = [];
        for (let i = 0; i < 7; i++) {
          if (!take(pool[i], 2)) return null;
          pairs.push(pool[i]);
          closedTilesWithWin.push(pool[i], pool[i]);
        }
        winTileIdx = pickRandom(pairs);
      } else if (arch === 'pinfu') {
        isMenzen = true;
        isTsumo = Math.random() < 0.6;
        hasRiichi = Math.random() < 0.65;

        const winS = pickRandom(suits);
        const winStart = 1 + Math.floor(Math.random() * 5);
        const s0 = [winS + winStart, winS + winStart + 1, winS + winStart + 2];
        for (const t of s0) if (!take(t, 1)) return null;
        closedTilesWithWin.push(...s0);
        winTileIdx = Math.random() < 0.5 ? s0[0] : s0[2];

        for (let m = 0; m < 3; m++) {
          const s = pickRandom(suits);
          const st = Math.floor(Math.random() * 7);
          const seq = [s + st, s + st + 1, s + st + 2];
          for (const t of seq) if (!take(t, 1)) return null;
          closedTilesWithWin.push(...seq);
        }

        const guestWinds = [27, 28, 29, 30].filter(w => w !== roundWindIdx && w !== seatWindIdx);
        const jPool = [...guestWinds, 1, 13, 25];
        const jIdx = pickRandom(jPool);
        if (!take(jIdx, 2)) return null;
        closedTilesWithWin.push(jIdx, jIdx);
      } else if (arch === 'open_pinfu_30fu') {
        isMenzen = false;
        isTsumo = false;
        hasRiichi = false;

        const winS = pickRandom(suits);
        const winStart = 1 + Math.floor(Math.random() * 4);
        const s0 = [winS + winStart, winS + winStart + 1, winS + winStart + 2];
        for (const t of s0) if (!take(t, 1)) return null;
        closedTilesWithWin.push(...s0);
        winTileIdx = Math.random() < 0.5 ? s0[0] : s0[2];

        for (let m = 0; m < 3; m++) {
          const s = pickRandom(suits);
          const st = 1 + Math.floor(Math.random() * 5);
          const seq = [s + st, s + st + 1, s + st + 2];
          for (const t of seq) if (!take(t, 1)) return null;
          if (m === 0) {
            fixedMelds.push({ kind: 'shuntsu', tiles: seq, isOpen: true });
          } else {
            closedTilesWithWin.push(...seq);
          }
        }

        const jS = pickRandom(suits);
        const jIdx = jS + 1 + Math.floor(Math.random() * 7);
        if (!take(jIdx, 2)) return null;
        closedTilesWithWin.push(jIdx, jIdx);
      } else if (arch === 'shanpon_ron_trap') {
        isMenzen = Math.random() < 0.7;
        isTsumo = false;
        hasRiichi = isMenzen;

        const k1Idx = pickRandom([0, 8, 9, 17, 18, 26, 31, 32, 33, 2, 12, 22]);
        if (!take(k1Idx, 3)) return null;
        closedTilesWithWin.push(k1Idx, k1Idx, k1Idx);
        winTileIdx = k1Idx;

        const k2Idx = pickRandom([0, 8, 18, 26, 4, 14, 24]);
        if (!take(k2Idx, 3)) return null;
        closedTilesWithWin.push(k2Idx, k2Idx, k2Idx);

        for (let m = 0; m < 2; m++) {
          const s = pickRandom(suits);
          const st = 1 + Math.floor(Math.random() * 5);
          const seq = [s + st, s + st + 1, s + st + 2];
          for (const t of seq) if (!take(t, 1)) return null;
          if (!isMenzen && m === 1) {
            fixedMelds.push({ kind: 'shuntsu', tiles: seq, isOpen: true });
          } else {
            closedTilesWithWin.push(...seq);
          }
        }

        const jIdx = pickRandom([31, 32, 33, roundWindIdx, seatWindIdx, 5, 15]);
        if (!take(jIdx, 2)) return null;
        closedTilesWithWin.push(jIdx, jIdx);
      } else if (arch === 'double_wind_jantou') {
        const dblWind = pickRandom([27, 28]);
        roundWindIdx = dblWind;
        seatWindIdx = dblWind;
        isMenzen = Math.random() < 0.7;
        isTsumo = Math.random() < 0.5;
        hasRiichi = isMenzen && Math.random() < 0.6;

        if (!take(dblWind, 2)) return null;
        closedTilesWithWin.push(dblWind, dblWind);

        const kIdx = isMenzen ? pickRandom([0, 8, 2, 13, 24, 31, 32, 33]) : pickRandom([31, 32, 33]);
        if (!take(kIdx, 3)) return null;
        if (!isMenzen) {
          fixedMelds.push({ kind: 'koutsu', tiles: [kIdx, kIdx, kIdx], isOpen: true });
        } else {
          closedTilesWithWin.push(kIdx, kIdx, kIdx);
        }

        for (let m = 0; m < 2; m++) {
          const s = pickRandom(suits);
          const st = Math.floor(Math.random() * 7);
          const seq = [s + st, s + st + 1, s + st + 2];
          for (const t of seq) if (!take(t, 1)) return null;
          closedTilesWithWin.push(...seq);
        }

        const wS = pickRandom(suits);
        const wSt = 1 + Math.floor(Math.random() * 5);
        const wSeq = [wS + wSt, wS + wSt + 1, wS + wSt + 2];
        for (const t of wSeq) if (!take(t, 1)) return null;
        closedTilesWithWin.push(...wSeq);
        winTileIdx = Math.random() < 0.5 ? wSeq[1] : wSeq[0];
      } else if (arch === 'high_fu_kan') {
        isMenzen = Math.random() < 0.6;
        isTsumo = Math.random() < 0.5;
        hasRiichi = isMenzen && Math.random() < 0.5;

        const kanIdx = pickRandom([0, 8, 9, 17, 18, 26, 31, 32, 33, 3, 13, 23]);
        if (!take(kanIdx, 4)) return null;
        const isOpenKan = !isMenzen && Math.random() < 0.5;
        fixedMelds.push({ kind: 'kantsu', tiles: [kanIdx, kanIdx, kanIdx, kanIdx], isOpen: isOpenKan });

        const needYakuhai = !isMenzen && kanIdx < 31 && kanIdx !== roundWindIdx && kanIdx !== seatWindIdx;
        const k2Idx = needYakuhai ? pickRandom([31, 32, 33, roundWindIdx, seatWindIdx]) : pickRandom([0, 8, 2, 12, 22, 31]);
        if (!take(k2Idx, 3)) return null;
        if (!isMenzen && needYakuhai) {
          fixedMelds.push({ kind: 'koutsu', tiles: [k2Idx, k2Idx, k2Idx], isOpen: true });
        } else {
          closedTilesWithWin.push(k2Idx, k2Idx, k2Idx);
        }

        for (let m = 0; m < 2; m++) {
          const s = pickRandom(suits);
          const st = 1 + Math.floor(Math.random() * 5);
          const seq = [s + st, s + st + 1, s + st + 2];
          for (const t of seq) if (!take(t, 1)) return null;
          closedTilesWithWin.push(...seq);
          if (m === 1) winTileIdx = Math.random() < 0.5 ? seq[1] : seq[0];
        }

        const jIdx = pickRandom([31, 32, 33, roundWindIdx, seatWindIdx, 4, 14]);
        if (!take(jIdx, 2)) return null;
        closedTilesWithWin.push(jIdx, jIdx);
      } else if (arch === 'toitoi_sanankou') {
        isMenzen = false;
        isTsumo = Math.random() < 0.5;
        hasRiichi = false;

        const kCandidates = [0, 8, 9, 17, 18, 26, 31, 32, 33, 2, 5, 12, 15, 21, 24].sort(() => Math.random() - 0.5);
        for (let m = 0; m < 4; m++) {
          const kIdx = kCandidates[m];
          if (!take(kIdx, 3)) return null;
          const isOpen = (m === 0) || (m === 1 && Math.random() < 0.5);
          if (isOpen) {
            fixedMelds.push({ kind: 'koutsu', tiles: [kIdx, kIdx, kIdx], isOpen: true });
          } else {
            closedTilesWithWin.push(kIdx, kIdx, kIdx);
          }
        }
        const jIdx = kCandidates[4];
        if (!take(jIdx, 2)) return null;
        closedTilesWithWin.push(jIdx, jIdx);
        winTileIdx = jIdx;
      } else {
        isMenzen = arch !== 'open_yakuhai';
        isTsumo = Math.random() < 0.45;
        hasRiichi = isMenzen && Math.random() < 0.65;

        const kPool = arch === 'open_yakuhai'
          ? [31, 32, 33, roundWindIdx, seatWindIdx]
          : arch === 'tanyao_standard'
            ? [2, 3, 5, 11, 13, 15, 20, 22, 24]
            : [0, 8, 9, 17, 18, 26, 31, 32, 33, 2, 12, 22];
        const kIdx = pickRandom(kPool);
        if (!take(kIdx, 3)) return null;
        if (!isMenzen) {
          fixedMelds.push({ kind: 'koutsu', tiles: [kIdx, kIdx, kIdx], isOpen: true });
        } else {
          closedTilesWithWin.push(kIdx, kIdx, kIdx);
        }

        for (let m = 0; m < 3; m++) {
          const s = pickRandom(suits);
          const st = arch === 'tanyao_standard' ? (1 + Math.floor(Math.random() * 5)) : Math.floor(Math.random() * 7);
          const seq = [s + st, s + st + 1, s + st + 2];
          for (const t of seq) if (!take(t, 1)) return null;
          closedTilesWithWin.push(...seq);
          if (m === 2) {
            winTileIdx = Math.random() < 0.5 ? seq[1] : seq[0];
          }
        }

        const jPool = arch === 'tanyao_standard'
          ? [2, 4, 6, 11, 14, 21, 24]
          : [31, 32, 33, roundWindIdx, seatWindIdx, 29, 30, 0, 8, 4, 14];
        const jIdx = pickRandom(jPool);
        if (!take(jIdx, 2)) return null;
        closedTilesWithWin.push(jIdx, jIdx);
        if (arch === 'menzen_ankou_tanki') {
          winTileIdx = jIdx;
        }
      }

      const allHandTiles = [...closedTilesWithWin];
      fixedMelds.forEach(m => allHandTiles.push(...m.tiles));

      const validInds = [];
      for (let i = 0; i < 34; i++) {
        if (canUse(i, 1)) validInds.push(i);
      }
      if (validInds.length === 0) return null;

      const matchingInds = validInds.filter(ind => allHandTiles.includes(getActualDoraIdx(ind)));
      const doraIndicatorIdx = (matchingInds.length > 0 && Math.random() < 0.45)
        ? pickRandom(matchingInds)
        : pickRandom(validInds);
      take(doraIndicatorIdx, 1);

      // Ippatsu (~30% when Riichi) & Ura-Dora Indicator (always drawn when Riichi, respecting 136-tile limit)
      const hasIppatsu = Boolean(hasRiichi && isMenzen && Math.random() < 0.30);
      let uraDoraIndicatorIdx = null;
      if (hasRiichi && isMenzen) {
        const validUraInds = [];
        for (let i = 0; i < 34; i++) {
          if (canUse(i, 1)) validUraInds.push(i);
        }
        if (validUraInds.length === 0) return null;
        const matchingUra = validUraInds.filter(ind => allHandTiles.includes(getActualDoraIdx(ind)));
        uraDoraIndicatorIdx = (matchingUra.length > 0 && Math.random() < 0.32)
          ? pickRandom(matchingUra)
          : pickRandom(validUraInds);
        take(uraDoraIndicatorIdx, 1);
      }

      // Strictly derive isMenzen from whether any open meld exists
      isMenzen = fixedMelds.every(m => !m.isOpen);
      if (!isMenzen) {
        hasRiichi = false;
      }

      // Assign authentic sideways tile index & tile order for each open meld
      fixedMelds.forEach(m => {
        if (!m.isOpen) {
          m.sidewaysIndex = -1;
          return;
        }
        if (m.kind === 'shuntsu') {
          // Chi is always called from Kamicha (left player): called tile goes to index 0 and is sideways
          const calledPos = Math.floor(Math.random() * 3);
          const calledTile = m.tiles[calledPos];
          const rest = m.tiles.filter((_, idx) => idx !== calledPos);
          m.displayTiles = [calledTile, ...rest];
          m.sidewaysIndex = 0;
        } else if (m.kind === 'kantsu') {
          // Daiminkan: sideways at 0 (Kamicha), 1 (Toimen), or 3 (Shimocha)
          m.displayTiles = [...m.tiles];
          m.sidewaysIndex = pickRandom([0, 1, 3]);
        } else {
          // Pon: sideways at 0 (Kamicha), 1 (Toimen), or 2 (Shimocha)
          m.displayTiles = [...m.tiles];
          m.sidewaysIndex = Math.floor(Math.random() * 3);
        }
      });

      const solved = evaluateHandHighestScore({
        closedTilesWithWin,
        fixedMelds,
        winTileIdx,
        roundWindIdx,
        seatWindIdx,
        isMenzen,
        isTsumo,
        hasRiichi,
        hasIppatsu,
        doraIndicatorIdx,
        uraDoraIndicatorIdx
      });

      if (!solved) return null;

      return {
        roundWindIdx,
        seatWindIdx,
        isDealer: seatWindIdx === 27,
        isMenzen,
        isTsumo,
        hasRiichi,
        hasIppatsu,
        doraIndicatorIdx,
        uraDoraIndicatorIdx,
        closedTilesWithWin,
        fixedMelds,
        winTileIdx,
        ...solved
      };
    }

    /*************************************************************************
     * 3. REVIEW STORAGE (localStorage) & UI STATE CONTROLLERS
     *************************************************************************/
    const STORAGE_KEY_REVIEW = 'mahjong_fu_trainer_review_v1';

    const state = {
      currentProb: null,
      answered: false,
      isReviewMode: false,
      reviewQueue: [],
      isDualInput: false,
      activeField: 'single',
      valSingle: '',
      valKo: '',
      valOya: '',
      streak: 0,
      correctCount: 0,
      totalCount: 0
    };

    function createProblemId(p) {
      const closedSorted = [...p.closedTilesWithWin].sort((a, b) => a - b).join(',');
      const meldsKey = p.fixedMelds.map(m => `${m.kind}:${m.isOpen ? 1 : 0}:${m.sidewaysIndex ?? 0}:${m.tiles.join('.')}`).join('|');
      return [
        p.roundWindIdx,
        p.seatWindIdx,
        p.isMenzen ? 1 : 0,
        p.isTsumo ? 1 : 0,
        p.hasRiichi ? 1 : 0,
        p.hasIppatsu ? 1 : 0,
        p.doraIndicatorIdx,
        p.uraDoraIndicatorIdx ?? -1,
        p.winTileIdx,
        closedSorted,
        meldsKey
      ].join('_');
    }

    function serializeProblemForStorage(p) {
      return {
        id: createProblemId(p),
        roundWindIdx: p.roundWindIdx,
        seatWindIdx: p.seatWindIdx,
        isMenzen: p.isMenzen,
        isTsumo: p.isTsumo,
        hasRiichi: p.hasRiichi,
        hasIppatsu: Boolean(p.hasIppatsu),
        doraIndicatorIdx: p.doraIndicatorIdx,
        uraDoraIndicatorIdx: p.uraDoraIndicatorIdx ?? null,
        closedTilesWithWin: [...p.closedTilesWithWin],
        fixedMelds: p.fixedMelds.map(m => ({
          kind: m.kind,
          tiles: [...m.tiles],
          displayTiles: m.displayTiles ? [...m.displayTiles] : [...m.tiles],
          isOpen: m.isOpen,
          sidewaysIndex: typeof m.sidewaysIndex === 'number' ? m.sidewaysIndex : (m.isOpen ? 0 : -1)
        })),
        winTileIdx: p.winTileIdx
      };
    }

    function hydrateProblemFromStorage(raw) {
      if (!raw || !Array.isArray(raw.closedTilesWithWin)) return null;
      const fixedMelds = (raw.fixedMelds || []).map(m => ({
        kind: m.kind,
        tiles: [...m.tiles],
        displayTiles: m.displayTiles ? [...m.displayTiles] : [...m.tiles],
        isOpen: Boolean(m.isOpen),
        sidewaysIndex: typeof m.sidewaysIndex === 'number' ? m.sidewaysIndex : (m.isOpen ? 0 : -1)
      }));
      const solved = evaluateHandHighestScore({
        closedTilesWithWin: raw.closedTilesWithWin,
        fixedMelds,
        winTileIdx: raw.winTileIdx,
        roundWindIdx: raw.roundWindIdx,
        seatWindIdx: raw.seatWindIdx,
        isMenzen: raw.isMenzen,
        isTsumo: raw.isTsumo,
        hasRiichi: raw.hasRiichi,
        hasIppatsu: Boolean(raw.hasIppatsu),
        doraIndicatorIdx: raw.doraIndicatorIdx,
        uraDoraIndicatorIdx: raw.uraDoraIndicatorIdx ?? null
      });
      if (!solved) return null;
      return {
        id: raw.id || createProblemId(raw),
        roundWindIdx: raw.roundWindIdx,
        seatWindIdx: raw.seatWindIdx,
        isDealer: raw.seatWindIdx === 27,
        isMenzen: raw.isMenzen,
        isTsumo: raw.isTsumo,
        hasRiichi: raw.hasRiichi,
        hasIppatsu: Boolean(raw.hasIppatsu),
        doraIndicatorIdx: raw.doraIndicatorIdx,
        uraDoraIndicatorIdx: raw.uraDoraIndicatorIdx ?? null,
        closedTilesWithWin: [...raw.closedTilesWithWin],
        fixedMelds,
        winTileIdx: raw.winTileIdx,
        ...solved
      };
    }

    function loadReviewQueueFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_REVIEW);
        if (!raw) {
          state.reviewQueue = [];
          return;
        }
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          state.reviewQueue = parsed.filter(item => item && Array.isArray(item.closedTilesWithWin));
        }
      } catch (e) {
        state.reviewQueue = [];
      }
    }

    function saveReviewQueueToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_REVIEW, JSON.stringify(state.reviewQueue));
      } catch (e) {
        // Ignore storage quota errors
      }
      updateReviewHeaderUI();
    }

    function isProblemInReviewQueue(p) {
      if (!p) return false;
      const id = createProblemId(p);
      return state.reviewQueue.some(item => item.id === id);
    }

    function addProblemToReviewQueue(p) {
      const id = createProblemId(p);
      if (state.reviewQueue.some(item => item.id === id)) return false;
      state.reviewQueue.push(serializeProblemForStorage(p));
      saveReviewQueueToStorage();
      return true;
    }

    function removeProblemFromReviewQueue(p) {
      const id = createProblemId(p);
      const before = state.reviewQueue.length;
      state.reviewQueue = state.reviewQueue.filter(item => item.id !== id);
      if (state.reviewQueue.length !== before) {
        saveReviewQueueToStorage();
        return true;
      }
      return false;
    }

    function updateReviewHeaderUI() {
      const btn = document.getElementById('btn-toggle-review');
      const pill = document.getElementById('mode-indicator-pill');
      const count = state.reviewQueue.length;

      if (state.isReviewMode && count === 0) {
        state.isReviewMode = false;
      }

      if (state.isReviewMode) {
        btn.textContent = `通常出題へ (残${count}問)`;
        btn.className = 'px-2 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-black text-[11px] sm:text-xs border border-rose-700 whitespace-nowrap transition';
        pill.classList.remove('hidden');
      } else {
        btn.textContent = `復習 (${count}問)`;
        btn.className = count > 0
          ? 'px-2 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-700 font-black text-[11px] sm:text-xs border border-rose-200 whitespace-nowrap transition'
          : 'px-2 py-1 rounded-lg bg-slate-100 text-slate-400 font-bold text-[11px] sm:text-xs border border-slate-200 whitespace-nowrap transition';
        pill.classList.add('hidden');
      }
    }

    function updateStatsUI(isCorrect) {
      state.totalCount++;
      if (isCorrect) {
        state.correctCount++;
        state.streak++;
      } else {
        state.streak = 0;
      }
      const rate = state.totalCount > 0 ? Math.round((state.correctCount / state.totalCount) * 100) : 0;
      document.getElementById('stat-total').textContent = `${state.totalCount}問`;
      document.getElementById('stat-accuracy').textContent = `${state.correctCount}問 (${rate}%)`;
      document.getElementById('stat-streak').textContent = `${state.streak}問`;
    }

    function generateAndLoadProblem() {
      updateReviewHeaderUI();

      let nextProb = null;
      if (state.isReviewMode && state.reviewQueue.length > 0) {
        const pickedRaw = pickRandom(state.reviewQueue);
        nextProb = hydrateProblemFromStorage(pickedRaw);
      }
      if (!nextProb) {
        state.isReviewMode = false;
        updateReviewHeaderUI();
        nextProb = generateRigorousFuProblem();
      }

      state.currentProb = nextProb;
      state.answered = false;
      const p = state.currentProb;

      // 1-Line Situation Badges (Wind, Riichi, Ippatsu only)
      const windBadge = document.getElementById('hud-wind-badge');
      windBadge.textContent = `${TILE_NAMES_JA[p.roundWindIdx]}場 ${TILE_NAMES_JA[p.seatWindIdx]}家(${p.isDealer ? '親' : '子'})`;
      windBadge.className = p.isDealer
        ? 'px-1.5 sm:px-2 py-0.5 rounded-md bg-amber-600 text-white font-black text-[11px] sm:text-xs shrink-0'
        : 'px-1.5 sm:px-2 py-0.5 rounded-md bg-emerald-600 text-white font-black text-[11px] sm:text-xs shrink-0';

      // Show Riichi badge ONLY when Riichi is declared (never show 門前 or 副露)
      const riichiBadge = document.getElementById('hud-riichi-badge');
      if (p.hasRiichi) {
        riichiBadge.classList.remove('hidden');
      } else {
        riichiBadge.classList.add('hidden');
      }

      // Ippatsu Badge
      const ippatsuBadge = document.getElementById('hud-ippatsu-badge');
      if (p.hasRiichi && p.hasIppatsu) {
        ippatsuBadge.classList.remove('hidden');
      } else {
        ippatsuBadge.classList.add('hidden');
      }

      // Dora & Ura-Dora Indicator Tiles
      document.getElementById('hud-dora-tile').innerHTML = renderTileSVG(p.doraIndicatorIdx);
      const uraWrap = document.getElementById('hud-uradora-wrap');
      const uraTileEl = document.getElementById('hud-uradora-tile');
      if (p.hasRiichi && p.uraDoraIndicatorIdx !== null && p.uraDoraIndicatorIdx !== undefined) {
        uraTileEl.innerHTML = renderTileSVG(p.uraDoraIndicatorIdx);
        uraWrap.classList.remove('hidden');
      } else {
        uraTileEl.innerHTML = '';
        uraWrap.classList.add('hidden');
      }

      // Render Strictly Single-Row Hand (with sideways called tile in open melds)
      renderSingleRowHand();

      // Configure Score Input
      setupDirectInputForProblem();

      document.getElementById('answer-section').classList.remove('hidden');
      document.getElementById('result-section').classList.add('hidden');
    }

    /**
     * Renders all tiles (closed tiles + open melds with 1 sideways tile + winning tile) into a single flex-nowrap container.
     * Upright tiles use `.tile-fluid-item` (flex: 100) and sideways called tiles use `.tile-fluid-sideways` (flex: 140),
     * aligning flush at the bottom without ever wrapping on smartphone screens.
     */
    function renderSingleRowHand() {
      const p = state.currentProb;
      const container = document.getElementById('hand-tiles-container');

      const closedCopy = [...p.closedTilesWithWin];
      const winPos = closedCopy.indexOf(p.winTileIdx);
      if (winPos !== -1) closedCopy.splice(winPos, 1);
      closedCopy.sort((a, b) => a - b);

      let html = '';

      // 1. Closed Hand Tiles
      closedCopy.forEach(tIdx => {
        html += `<div class="tile-fluid-item">${renderTileSVG(tIdx)}</div>`;
      });

      // 2. Winning Tile (Tsumo / Ron) placed right after closed hand with floating top badge so bottom edge stays 100% flush
      const winLabel = p.isTsumo ? 'ツモ' : 'ロン';
      html += `
        <div class="tile-fluid-item tile-group-gap">
          <span class="win-tile-badge">${winLabel}</span>
          ${renderTileSVG(p.winTileIdx, { highlight: true })}
        </div>
      `;

      // 3. Open Melds (Pon / Chi / Minkan with 1 sideways tile) & Closed Kan (Ankan: 2 back, 2 face-up)
      p.fixedMelds.forEach(m => {
        const sidewaysIdx = m.isOpen
          ? (typeof m.sidewaysIndex === 'number' && m.sidewaysIndex >= 0 ? m.sidewaysIndex : 0)
          : -1;
        const tilesToRender = (m.isOpen && Array.isArray(m.displayTiles) && m.displayTiles.length === m.tiles.length)
          ? m.displayTiles
          : m.tiles;

        tilesToRender.forEach((tIdx, i) => {
          const gapClass = i === 0 ? 'tile-group-gap' : '';
          const isBack = (m.kind === 'kantsu' && !m.isOpen && (i === 0 || i === 3));
          const isSideways = m.isOpen && i === sidewaysIdx;

          if (isSideways) {
            html += `
              <div class="tile-fluid-sideways ${gapClass}">
                ${renderSidewaysTileSVG(tIdx)}
              </div>
            `;
          } else {
            html += `
              <div class="tile-fluid-item ${gapClass}">
                ${renderTileSVG(tIdx, { isBack })}
              </div>
            `;
          }
        });
      });

      container.innerHTML = html;
    }

    function setupDirectInputForProblem() {
      const p = state.currentProb;
      state.valSingle = '';
      state.valKo = '';
      state.valOya = '';
      state.isDualInput = !p.isDealer && p.isTsumo;

      const singleWrap = document.getElementById('single-input-wrap');
      const dualWrap = document.getElementById('dual-input-wrap');
      const labelSingleLeft = document.getElementById('label-single-left');
      const unitSingle = document.getElementById('unit-single');
      document.getElementById('input-error-msg').classList.add('hidden');

      if (state.isDualInput) {
        singleWrap.classList.add('hidden');
        dualWrap.classList.remove('hidden');
        state.activeField = 'ko';
      } else {
        singleWrap.classList.remove('hidden');
        dualWrap.classList.add('hidden');
        state.activeField = 'single';

        if (p.isDealer && p.isTsumo) {
          labelSingleLeft.textContent = '親のツモ和了';
          unitSingle.textContent = '点オール';
        } else if (p.isDealer && !p.isTsumo) {
          labelSingleLeft.textContent = '親のロン和了';
          unitSingle.textContent = '点';
        } else {
          labelSingleLeft.textContent = '子のロン和了';
          unitSingle.textContent = '点';
        }
      }

      refreshInputBoxesUI();
    }

    function refreshInputBoxesUI() {
      const valSingleEl = document.getElementById('val-single');
      const valKoEl = document.getElementById('val-ko');
      const valOyaEl = document.getElementById('val-oya');
      const boxSingle = document.getElementById('box-single');
      const boxKo = document.getElementById('box-ko');
      const boxOya = document.getElementById('box-oya');
      const submitLabel = document.getElementById('submit-btn-label');

      valSingleEl.textContent = state.valSingle || '0';
      valSingleEl.className = state.valSingle
        ? 'font-mono font-black text-2xl sm:text-3xl text-slate-900'
        : 'font-mono font-black text-2xl sm:text-3xl text-slate-300';

      valKoEl.textContent = state.valKo || '0';
      valKoEl.className = state.valKo
        ? 'font-mono font-black text-xl sm:text-2xl text-slate-900'
        : 'font-mono font-black text-xl sm:text-2xl text-slate-300';

      valOyaEl.textContent = state.valOya || '0';
      valOyaEl.className = state.valOya
        ? 'font-mono font-black text-xl sm:text-2xl text-slate-900'
        : 'font-mono font-black text-xl sm:text-2xl text-slate-300';

      boxSingle.classList.toggle('score-input-active', state.activeField === 'single');
      boxKo.classList.toggle('score-input-active', state.activeField === 'ko');
      boxOya.classList.toggle('score-input-active', state.activeField === 'oya');

      if (state.isDualInput && state.activeField === 'ko' && state.valKo && !state.valOya) {
        submitLabel.textContent = '親の点数へ ▶';
      } else if (state.isDualInput && state.activeField === 'oya' && state.valOya && !state.valKo) {
        submitLabel.textContent = '子の点数へ ▶';
      } else {
        submitLabel.textContent = '回答する';
      }
    }

    function handleTenkeyInput(key) {
      if (state.answered) return;
      document.getElementById('input-error-msg').classList.add('hidden');

      const propName = state.activeField === 'ko'
        ? 'valKo'
        : state.activeField === 'oya'
          ? 'valOya'
          : 'valSingle';

      let cur = state[propName];

      if (key === 'CLR' || key === 'BS') {
        cur = '';
      } else {
        if (cur === '' && (key === '0' || key === '00')) {
          return;
        }
        if ((cur + key).length <= 6) {
          cur += key;
        }
      }

      state[propName] = cur;
      refreshInputBoxesUI();
    }

    function submitScoreAnswer() {
      if (state.answered) return;
      const p = state.currentProb;

      if (state.isDualInput) {
        if (state.activeField === 'ko' && state.valKo !== '' && state.valOya === '') {
          state.activeField = 'oya';
          refreshInputBoxesUI();
          return;
        }
        if (state.activeField === 'oya' && state.valOya !== '' && state.valKo === '') {
          state.activeField = 'ko';
          refreshInputBoxesUI();
          return;
        }
        if (state.valKo === '' || state.valOya === '') {
          document.getElementById('input-error-msg').classList.remove('hidden');
          return;
        }

        const numKo = parseInt(state.valKo, 10);
        const numOya = parseInt(state.valOya, 10);
        state.answered = true;

        const isCorrect = (numKo === p.scoreInfo.expectedKo) && (numOya === p.scoreInfo.expectedOya);
        updateStatsUI(isCorrect);
        showResultAndExplanation(isCorrect, `${numKo.toLocaleString()} / ${numOya.toLocaleString()}点`);
      } else {
        if (state.valSingle === '') {
          document.getElementById('input-error-msg').classList.remove('hidden');
          return;
        }

        const numVal = parseInt(state.valSingle, 10);
        state.answered = true;

        const isCorrect = numVal === p.scoreInfo.expectedSingle;
        updateStatsUI(isCorrect);
        const userText = (p.isDealer && p.isTsumo)
          ? `${numVal.toLocaleString()}点オール`
          : `${numVal.toLocaleString()}点`;
        showResultAndExplanation(isCorrect, userText);
      }
    }

    /*************************************************************************
     * 4. SINGLE-COLUMN, 1-LINE-PER-ITEM EXPLANATION RENDERER
     *************************************************************************/
    function showResultAndExplanation(isCorrect, userSummaryText) {
