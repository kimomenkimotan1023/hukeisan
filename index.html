      const p = state.currentProb;
      document.getElementById('answer-section').classList.add('hidden');
      document.getElementById('result-section').classList.remove('hidden');

      const vBanner = document.getElementById('verdict-banner');
      const vBadge = document.getElementById('verdict-badge');
      const vSummary = document.getElementById('verdict-summary');
      const vUserAns = document.getElementById('verdict-user-ans');

      const limitTag = p.scoreInfo.limitName ? ` ${p.scoreInfo.limitName}` : '';
      const correctHeadline = `${p.finalFu}符 ${p.totalHan}飜${limitTag} ${p.scoreInfo.scoreLabel}`;

      if (isCorrect) {
        vBanner.className = 'rounded-2xl p-3.5 border-2 border-emerald-500 bg-emerald-50/70 shadow-sm space-y-2.5';
        vBadge.className = 'px-2.5 py-0.5 rounded-md bg-emerald-600 text-white text-xs font-black shrink-0';
        vBadge.textContent = '正解';
        vSummary.textContent = correctHeadline;
        vUserAns.textContent = '';

        if (state.isReviewMode && removeProblemFromReviewQueue(p)) {
          document.getElementById('review-status-msg').textContent = '✓ 復習リストからクリアしました';
        } else {
          document.getElementById('review-status-msg').textContent = isProblemInReviewQueue(p)
            ? '復習リストに登録されています'
            : '復習リストに未登録';
        }
      } else {
        vBanner.className = 'rounded-2xl p-3.5 border-2 border-rose-500 bg-rose-50/70 shadow-sm space-y-2.5';
        vBadge.className = 'px-2.5 py-0.5 rounded-md bg-rose-600 text-white text-xs font-black shrink-0';
        vBadge.textContent = '不正解';
        vSummary.textContent = `正解：${correctHeadline}`;
        vUserAns.textContent = `回答: ${userSummaryText}`;

        addProblemToReviewQueue(p);
        document.getElementById('review-status-msg').textContent = '📌 間違えた問題を復習リストに記憶しました';
      }

      refreshBookmarkButtonUI();

      // 1-Line-Per-Item Yaku List
      document.getElementById('explain-han-total').textContent = `合計 ${p.totalHan}飜${limitTag}`;
      document.getElementById('explain-yaku-list').innerHTML = p.yakuList.map(y => `
        <div class="flex items-center justify-between py-1.5 whitespace-nowrap">
          <span class="font-bold text-slate-800">${y.name}</span>
          <span class="font-mono font-black text-indigo-700">${y.han}飜</span>
        </div>
      `).join('');

      // 1-Line-Per-Item Fu List
      const fuTotalEl = document.getElementById('explain-fu-total');
      if (p.isChiitoitsu) {
        fuTotalEl.textContent = '七対子 25符固定';
      } else if (p.rawFu === p.finalFu) {
        fuTotalEl.textContent = `合計 ${p.finalFu}符`;
      } else {
        fuTotalEl.textContent = `合計 ${p.rawFu}符 → 切上 ${p.finalFu}符`;
      }

      document.getElementById('explain-fu-list').innerHTML = p.fuLineItems.map(item => `
        <div class="flex items-center justify-between py-1.5 whitespace-nowrap">
          <span class="font-bold text-slate-700">${item.label}</span>
          <span class="font-mono font-black text-emerald-700">${item.fuText}</span>
        </div>
      `).join('');
    }

    /*************************************************************************
     * 5. EVENT LISTENERS
     *************************************************************************/
    function refreshBookmarkButtonUI() {
      const p = state.currentProb;
      const btn = document.getElementById('btn-toggle-bookmark');
      if (!p || !btn) return;
      const inQueue = isProblemInReviewQueue(p);
      if (inQueue) {
        btn.textContent = '復習リストから削除';
        btn.className = 'px-2.5 py-1 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-800 border border-rose-300 text-[11px] font-black shrink-0 transition';
      } else {
        btn.textContent = '復習リストに残す';
        btn.className = 'px-2.5 py-1 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-[11px] font-black shrink-0 transition';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadReviewQueueFromStorage();
      updateReviewHeaderUI();

      document.getElementById('box-single').addEventListener('click', () => {
        state.activeField = 'single';
        refreshInputBoxesUI();
      });
      document.getElementById('box-ko').addEventListener('click', () => {
        state.activeField = 'ko';
        refreshInputBoxesUI();
      });
      document.getElementById('box-oya').addEventListener('click', () => {
        state.activeField = 'oya';
        refreshInputBoxesUI();
      });

      document.querySelectorAll('.tenkey-btn[data-key]').forEach(btn => {
        btn.addEventListener('click', () => handleTenkeyInput(btn.dataset.key));
      });

      document.getElementById('btn-submit-score').addEventListener('click', submitScoreAnswer);
      document.getElementById('btn-generate-next').addEventListener('click', generateAndLoadProblem);
      document.getElementById('btn-next-after-result').addEventListener('click', generateAndLoadProblem);

      document.getElementById('btn-toggle-review').addEventListener('click', () => {
        if (!state.isReviewMode && state.reviewQueue.length === 0) return;
        state.isReviewMode = !state.isReviewMode;
        generateAndLoadProblem();
      });

      document.getElementById('btn-toggle-bookmark').addEventListener('click', () => {
        const p = state.currentProb;
        if (!p) return;
        if (isProblemInReviewQueue(p)) {
          removeProblemFromReviewQueue(p);
          document.getElementById('review-status-msg').textContent = '復習リストから削除しました';
        } else {
          addProblemToReviewQueue(p);
          document.getElementById('review-status-msg').textContent = '📌 復習リストに保存しました';
        }
        refreshBookmarkButtonUI();
      });

      window.addEventListener('keydown', (e) => {
        if (state.answered) {
          if (e.key === 'Enter') {
            e.preventDefault();
            generateAndLoadProblem();
          }
          return;
        }
        if (e.key >= '0' && e.key <= '9') {
          e.preventDefault();
          handleTenkeyInput(e.key);
        } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape') {
          e.preventDefault();
          handleTenkeyInput('CLR');
        } else if (e.key === 'Tab' && state.isDualInput) {
          e.preventDefault();
          state.activeField = state.activeField === 'ko' ? 'oya' : 'ko';
          refreshInputBoxesUI();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          submitScoreAnswer();
        }
      });

      generateAndLoadProblem();
    });
  </script>
